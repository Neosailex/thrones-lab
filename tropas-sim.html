<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tropas en partida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>:root{--bg:#110d0a;--panel:#1c1611;--stone:#2a221b;--line:#4a3b2a;--gold:#d2a64e;--gold-hi:#f0cf86;--fg:#ece2cf;--muted:#a8977a;--ember:#e2672c;--display:"Cinzel",Georgia,serif;--body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{background:var(--bg);color:var(--fg);margin:0}body{font-family:var(--body);padding:18px 16px 28px;font-size:15px;line-height:1.45}.wrap{flex-direction:column;gap:12px;max-width:1280px;margin-inline:auto;display:flex}header{flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 18px;display:flex}h1{font-family:var(--display);letter-spacing:.04em;color:var(--gold-hi);margin:0;font-size:clamp(20px,3vw,30px);font-weight:800}h1 small{letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:.6em;font-size:.5em;font-weight:600}.note{color:var(--muted);max-width:64ch;margin:0}.stage{border:1px solid var(--line);aspect-ratio:1280/720;background:#000;border-radius:6px;position:relative;overflow:hidden;box-shadow:0 10px 40px #00000080;container-type:inline-size}canvas{width:100%;height:100%;display:block;position:absolute;inset:0}.pill{color:#fff;font:800 1.45cqw/1 var(--display);text-align:center;background:#1b1612;border:2px solid #d8cbb4;border-radius:999px;min-width:2em;padding:.2em .5em;position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #000}.float{font:800 3.2cqw/1 var(--display);text-shadow:0 2px #000,0 0 8px #000;pointer-events:none;animation:1.4s ease-out forwards up;position:absolute;transform:translate(-50%,-50%)}.float.bad{color:#ff6a4a}.float.good{color:#8dff7a}@keyframes up{0%{opacity:0;translate:0 10px}15%{opacity:1}to{opacity:0;translate:0 -60px}}.cap{border:1px solid var(--gold);font:700 1.7cqw/1.2 var(--display);letter-spacing:.06em;color:var(--gold-hi);white-space:nowrap;background:#110d0ad1;border-radius:4px;padding:.35em .9em;transition:opacity .3s;position:absolute;top:13%;left:50%;transform:translate(-50%)}.controls{flex-wrap:wrap;gap:8px;display:flex}button{font-family:var(--body);color:var(--fg);background:linear-gradient(var(--stone),#211a14);border:1px solid var(--line);cursor:pointer;border-radius:4px;padding:8px 12px;font-size:14px;font-weight:700}button:hover{border-color:var(--gold);color:var(--gold-hi)}button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}button[aria-pressed=true]{border-color:var(--ember);color:#ffd9b8;background:linear-gradient(#3a2215,#24160e)}.log{color:var(--gold-hi);background:var(--panel);border:1px solid var(--line);white-space:pre;border-radius:6px;min-height:8em;margin:0;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;overflow-x:auto}</style>  <script type="module" crossorigin src="./assets/tropas-sim-Crznhwbc.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/tropa_real-CjEhTJtS.js">
</head><body>
<div class="wrap">
  <header>
    <h1>Tropas orcas <small>piloto</small></h1>
    <p class="note">Captura real del campo orco con las tropas nuevas a ~60 px: peones, soldados y chamanes con sus 3 túnicas. Marchan, trabajan, suben de nivel y mueren con ragdoll. Abajo, las marcas de sonido.</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Tropas orcas animadas frente a su castillo"></canvas>
    <div class="cap" id="cap">Tropas orcas</div>
  </div>
  <div class="controls" role="group" aria-label="Raza">
    <button type="button" data-raza="orco" aria-pressed="true">Orcos</button>
    <button type="button" data-raza="humano">Humanos</button>
    <button type="button" data-raza="enano">Enanos</button>
    <button type="button" data-raza="elfo">Elfos</button>
    <button type="button" data-raza="drow">Drows</button>
    <button type="button" data-raza="gnomo">Gnomos</button>
  </div>
  <div class="controls" role="group" aria-label="Nivel">
    <button type="button" data-tier="1">Nivel 1</button>
    <button type="button" data-tier="2">Nivel 2</button>
    <button type="button" data-tier="3">Nivel 3</button>
    <button id="bZoom" type="button" aria-pressed="false">Ver de cerca</button>
  </div>
  <div class="controls">
    <button id="bAuto" type="button" aria-pressed="true">Automático</button>
    <button id="bMarcha" type="button">Marchar</button>
    <button id="bTrabajo" type="button">Trabajar</button>
    <button id="bNivel" type="button">Subir de nivel</button>
    <button id="bCat" type="button">Catapulta (muerte)</button>
    <button id="bRayo" type="button">Carta: Rayo</button>
    <button id="bTormenta" type="button">Carta: Tormenta</button>
    <button id="bTempestad" type="button">Carta: Tempestad</button>
    <button id="bCruzada" type="button">Carta: Cruzada</button>
    <button id="bDragon" type="button">Carta: Dragón</button>
    <button id="bGolem" type="button">Carta: Gólem</button>
    <button id="bSlow" type="button" aria-pressed="false">Cámara lenta</button>
  </div>
  <pre class="log" id="log" aria-live="off">Marcas de sonido…</pre>
</div>
</body></html>
