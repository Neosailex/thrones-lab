<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thrones & Siege · Lab</title><meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0;height:100%;background:#16120d;color:#efe3c8;font:15px/1.2 Georgia,serif;overflow:hidden}
nav{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;background:#1c150d;border-bottom:1px solid #5a4630;z-index:2;padding-top:env(safe-area-inset-top)}
nav button{font:600 15px Georgia,serif;color:#efe3c8;background:#2a2218;border:1px solid #5a4630;border-radius:8px;padding:6px 16px;cursor:pointer}
nav button.on{background:#5a4024;border-color:#e8c46a;color:#ffe9b0}
nav small{position:absolute;right:10px;color:#8f7f63;font-size:11px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#fecha{position:fixed;left:6px;top:4px;z-index:3;color:#8f7f63;font-size:10px;pointer-events:none;opacity:.7}
@media (max-width:480px){nav small{display:none}}
/* (Juan 20/10) en el celular el lab se mira apaisado: pestañas finas; en vertical pide girar */
@media (max-height:500px) and (orientation:landscape){nav{height:32px}nav button{font-size:13px;padding:3px 12px}iframe{top:calc(32px + env(safe-area-inset-top));height:calc(100% - 32px - env(safe-area-inset-top))}nav small{display:none}}
#gira{display:none}
@media (orientation:portrait) and (max-width:760px){#gira{display:flex;position:fixed;inset:0;z-index:9;background:#16120d;color:#efe3c8;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}#gira b{font-size:20px;color:#e8c46a}#gira i{font-style:normal;font-size:64px;animation:g 2.4s ease-in-out infinite}@keyframes g{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}}
/* (Juan 23/10) si el celu no gira (rotación trabada o el navegador de WhatsApp), el lab se gira solo con girar/giro.js, el mismo
   código que usa el juego (girar.html): gira #giro (pestañas + lab) 90° y adentro todo se ve y se toca acostado */
#gira button{font:600 16px Georgia,serif;color:#16120d;background:#e8c46a;border:0;border-radius:10px;padding:10px 18px;margin-top:6px}
#giro{position:fixed;inset:0}
html.girado #gira{display:none!important}
html.girado nav{height:32px;padding-top:0;position:absolute}html.girado nav button{font-size:13px;padding:3px 12px}html.girado nav small{display:none}
html.girado iframe{position:absolute;top:0;height:100%}
</style></head><body>
<div id="gira"><i>📱</i><b>Girá el celular</b><span>El lab se ve apaisado</span><button id="forzar">¿No gira? Tocá acá y girá el celu a mano</button></div>
<div id="giro"><small id="fecha">29/10/2026, 10:56:12</small>
<iframe id="f" allow="autoplay; fullscreen"></iframe></div>
<script src="girar/giro.js"></script>
<script>
document.getElementById('f').src = 'campo/?campo';
let forzado = false; try { forzado = !!sessionStorage.getItem('lab-forzar'); } catch {}
const G = Giro.montar(document.getElementById('giro'), { activo: () => forzado });
document.getElementById('forzar').onclick = () => { forzado = true; try { sessionStorage.setItem('lab-forzar', '1'); } catch {} G.ajustar(); };
</script></body></html>
