<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>:root{--bg:#110d0a;--panel:#1c1611;--stone:#2a221b;--line:#4a3b2a;--gold:#d2a64e;--gold-hi:#f0cf86;--fg:#ece2cf;--muted:#a8977a;--ember:#e2672c;--display:"Cinzel",Georgia,serif;--body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{background:var(--bg);color:var(--fg);margin:0}body{font-family:var(--body);padding:18px 16px 28px;font-size:15px;line-height:1.45}.wrap{flex-direction:column;gap:12px;max-width:1280px;margin-inline:auto;display:flex}header{flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 18px;display:flex}h1{font-family:var(--display);letter-spacing:.04em;color:var(--gold-hi);margin:0;font-size:clamp(20px,3vw,30px);font-weight:800}h1 small{letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:.6em;font-size:.5em;font-weight:600}.note{color:var(--muted);max-width:64ch;margin:0}.stage{border:1px solid var(--line);aspect-ratio:1280/720;background:#000;border-radius:6px;position:relative;overflow:hidden;box-shadow:0 10px 40px #00000080;container-type:inline-size}canvas{width:100%;height:100%;display:block;position:absolute;inset:0}.pill{color:#fff;font:800 1.45cqw/1 var(--display);text-align:center;background:#1b1612;border:2px solid #d8cbb4;border-radius:999px;min-width:2em;padding:.2em .5em;position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #000}.float{font:800 3.2cqw/1 var(--display);text-shadow:0 2px #000,0 0 8px #000;pointer-events:none;animation:1.4s ease-out forwards up;position:absolute;transform:translate(-50%,-50%)}.float.bad{color:#ff6a4a}.float.good{color:#8dff7a}@keyframes up{0%{opacity:0;translate:0 10px}15%{opacity:1}to{opacity:0;translate:0 -60px}}.cap{border:1px solid var(--gold);font:700 1.7cqw/1.2 var(--display);letter-spacing:.06em;color:var(--gold-hi);white-space:nowrap;background:#110d0ad1;border-radius:4px;padding:.35em .9em;transition:opacity .3s;position:absolute;top:13%;left:50%;transform:translate(-50%)}.pill{transition:opacity .25s}.stage.zoom .pill{opacity:0}.controls{flex-wrap:wrap;gap:8px;display:flex}button{font-family:var(--body);color:var(--fg);background:linear-gradient(var(--stone),#211a14);border:1px solid var(--line);cursor:pointer;border-radius:4px;padding:8px 12px;font-size:14px;font-weight:700}button:hover{border-color:var(--gold);color:var(--gold-hi)}button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}button[aria-pressed=true]{border-color:var(--ember);color:#ffd9b8;background:linear-gradient(#3a2215,#24160e)}@media (max-height:500px) and (orientation:landscape){body{padding:6px 8px}header{display:none}.wrap{grid-template-columns:auto minmax(0,1fr);grid-auto-rows:min-content;align-items:start;gap:6px 10px;max-width:none;display:grid}.wrap>.stage{grid-area:1/1/span 30;width:auto;max-width:72vw;height:calc(100vh - 14px);position:sticky;top:6px}.wrap>:not(.stage):not(header){grid-column:2}.controls{gap:5px}button{padding:5px 8px;font-size:12px}}</style>  <script type="module" crossorigin src="./assets/partida-sim-BQaZHWFO.js"></script>

</head><body>
<div class="wrap">
  <header>
    <h1>Reyes en partida <small>simulación</small></h1>
    <p class="note">Captura del juego actual (1280×720) y el rey con el mismo código, escala y tiempos que en la partida. Elegí el rey: actúa (zoom al balcón), baja a atacar con la carta nueva «Carga real», lo desmayan y festeja.</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Partida simulada: el rey orco Gorrak en el balcón de su castillo"></canvas>
    <div class="pill" id="pCastle" style="left:13.5%;top:23.3%">50</div>
    <div class="pill" id="pWall" style="left:70.6%;top:56.4%">15</div>
    <div class="cap" id="cap">Tu turno</div>
  </div>
  <div class="controls" role="group" aria-label="Rey">
    <button type="button" data-king="gorrak">Gorrak</button>
    <button type="button" data-king="aldric">Aldric</button>
    <button type="button" data-king="thorgrim">Thorgrim</button>
    <button type="button" data-king="aelwyn">Aelwyn</button>
    <button type="button" data-king="vaelith">Vaelith</button>
    <button type="button" data-king="fizzwick">Fizzwick</button>
  </div>
  <div class="controls">
    <button id="bAuto" type="button" aria-pressed="true">Automático</button>
    <button id="bA" type="button">El rey actúa</button>
    <button id="bD" type="button">Carga real (baja y ataca)</button>
    <button id="bB" type="button">Asalto al balcón (desmayo)</button>
    <button id="bC" type="button">Bendición (festeja)</button>
    <button id="bSlow" type="button" aria-pressed="false">Cámara lenta</button>
    <button id="bSnd" type="button" aria-pressed="false">🔊 Activar sonido (Aldric, Aelwyn y Vaelith)</button>
  </div>
</div>
</body></html>
